<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fazenda</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="container">
<h1>🚜 Fazenda Sustentável</h1>
</header>

<section class="painel">

<div class="card">💰 Dinheiro<br><span id="dinheiro"></span></div>
<div class="card">💧 Água<br><span id="agua"></span></div>
<div class="card">🌱 Solo<br><span id="solo"></span></div>
<div class="card">🍗 Fome<br><span id="fome"></span></div>
<div class="card">🌦️ Clima<br><span id="clima"></span></div>

</section>

<section class="acoes">

<button onclick="plantar()">🌱 Plantar</button>
<button onclick="colher()">🌾 Colher</button>

<button onclick="comprarSemente()">🛒 Comprar Sementes</button>
<button onclick="comprarComida()">🍗 Comprar Comida</button>

<button onclick="vender()">💰 Vender Produção</button>

<button onclick="passarDia()">⏩ Passar Dia</button>

</section>

<div class="log" id="log">Bem-vindo à fazenda!</div>

<script src="js/app.js"></script>
</body>
</html>
