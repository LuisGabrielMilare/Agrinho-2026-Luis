<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- HUD -->
<div id="hud">
<div>💧 Água: <span id="agua"></span></div>
<div>🌱 Solo: <span id="solo"></span></div>
<div>🍗 Fome: <span id="fome"></span></div>
<div>💰 Dinheiro: <span id="dinheiro"></span></div>
<div>🌦️ Clima: <span id="clima"></span></div>
</div>

<!-- MUNDO -->
<div id="world">

<div class="tile water" style="top:120px;left:150px"></div>
<div class="tile field" style="top:200px;left:300px"></div>
<div class="tile market" style="top:320px;left:500px"></div>
<div class="tile house" style="top:420px;left:180px"></div>

<div id="player"></div>

</div>

<!-- LOG -->
<div id="log">Use WASD para andar e E para interagir</div>

<script src="js/app.js"></script>
</body>
</html>
